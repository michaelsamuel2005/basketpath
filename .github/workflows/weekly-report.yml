name: weekly-report
on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Regenerate weekly reports from the committed marts
        run: |
          if [ -f marts/daily_kpis.csv ]; then
            python -m basketpath.report --marts marts --out reports/weekly --all
          else
            echo "No marts yet: run the build on the real export first."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-reports
          path: reports/weekly
          if-no-files-found: ignore
